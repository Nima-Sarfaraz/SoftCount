name: Test Windows Compatibility

on:
  push:
    paths:
      - 'start.bat'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'api/**'
      - 'softagar/**'
      - 'frontend/**'
      - '.github/workflows/test-windows.yml'
  pull_request:
  workflow_dispatch:  # Allows manual triggering

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Run start.bat the way users do: it creates .venv, installs
      # dependencies and starts the server. stdin is nul so its final
      # "pause" returns; the server keeps running in the background.
      - name: Run start.bat end to end
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/c', 'start.bat < nul > start.log 2>&1' -WorkingDirectory $PWD -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Get-Content start.log
          if (-not $ok) { throw "start.bat did not bring up the server" }
          Write-Host "[OK] start.bat started the server"

      - name: Verify softagar package
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python --version
          python -c "import softagar; print('softagar version:', softagar.__version__ if hasattr(softagar, '__version__') else 'ok')" || exit /b 1
          python -c "from api.main import app; print('FastAPI app loaded')" || exit /b 1
          echo [OK] Package imports work

      - name: Build frontend
        shell: cmd
        run: |
          cd frontend
          call npm ci || exit /b 1
          set VITE_API_BASE_URL=
          call npm run build || exit /b 1
          echo [OK] Frontend built successfully
